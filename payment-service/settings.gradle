rootProject.name = 'payment-service'

include ('payment-service')
include ('payment-service-api')

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        maven { url 'https://jitpack.io' }

        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/DongHyeonKa/Account-server")

            credentials {
                username = providers.gradleProperty("GITHUB_USERNAME").getOrNull()
                password = providers.gradleProperty("GITHUB_TOKEN").getOrNull()
            }
        }
    }
}